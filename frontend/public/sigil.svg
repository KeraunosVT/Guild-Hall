<!--
  Placeholder emblem. Replace this file with your guild's own sigil, keeping
  the filename — index.html points at /sigil.svg for the favicon and
  src/guild.js exports the same path for in-app use.

  It doubles as a 16px favicon, so the shapes are deliberately heavy and few;
  anything finer disappears in a browser tab.
-->
