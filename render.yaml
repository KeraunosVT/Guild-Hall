# Render blueprint — deploys the whole app as one Node web service.
# Dashboard → New → Blueprint → point at your fork of this repo.
#
# Every secret is sync: false, so Render prompts you for the value instead of
# ever reading it from the repo. See SETUP.md for where each value comes from.
#
# MULTI-TENANT: this deployment serves every registered guild from one URL and
# one bot. Per-guild config — role ids, channel ids, timezone, guild-night
# rollover, branding — lives on that guild's row in the `guilds` table, NOT
# here. There are deliberately no DISCORD_GUILD_ID / *_ROLE_IDS / *_CHANNEL_ID
# variables: as env they applied one guild's settings to every tenant, which
# meant one house's officers holding powers in another and one house's LOA
# posts landing in another's channel. backend/test/leakAudit.js fails the build
# if any of them is read again. Register a guild with
# `node backend/scripts/onboardGuild.js`.
#
# Note: the free plan sleeps when idle, which also disconnects the Discord bot
# (slash commands and voice snapshots stop until the next web request wakes it).
# For an always-on bot, use "starter" or above.

services:
  - type: web
    name: guild-hall
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false # https://guild-hall.gg/api/auth/discord/callback — must be
                    # registered verbatim in the Discord Developer Portal
      # One bot serves every guild; which server it is acting on comes from the
      # interaction, not from env.
      - key: DISCORD_BOT_TOKEN
        sync: false
      # SINGLE_GUILD_ID is intentionally absent. Setting it pins the entire
      # deployment to one tenant (single-guild self-host mode) and every other
      # registered guild becomes unreachable from the web app.
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value
      - key: APP_URL
        sync: false # https://guild-hall.gg
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Who operates Guild Hall itself — NOT a per-guild setting, and the one
      # exception to the rule above about guild config never living in env.
      # It gates the public threat board, which belongs to no tenant, and it is
      # env-only on purpose: no guild's admin page can promote someone to
      # operating the platform. See backend/staff.js.
      #
      # Unset on an existing service until you add it in the dashboard —
      # Environment → Add Environment Variable — because a blueprint change does
      # not backfill values for a service that already exists. With none of the
      # three set, the board is read-only for everyone, which is what a 403 on
      # every edit means.
      - key: GUILD_HALL_STAFF_GUILD_ID
        sync: false # Discord server id of the Guild Hall HQ server
      - key: GUILD_HALL_STAFF_ROLE_ID
        sync: false # role in it whose holders may edit the board
      - key: GUILD_HALL_STAFF_IDS
        sync: false # optional: always-staff Discord user ids, comma separated
      # The wargame fill pool's own host (backend/sites.js). Empty = no merc
      # host; the fill pages still live inside the guild app.
      - key: MERC_ORIGIN
        sync: false # e.g. https://merc.guild-hall.gg
