name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The static leak audit needs no database, so it runs on every push
      # including forks, where secrets are not available. It is the check that
      # catches an unscoped query being added back.
      - name: Leak audit
        run: npm run test:audit

      # The integration suites create two throwaway guilds and delete them on
      # the way out. They need a database; point them at a TEST project, never
      # production — they write and delete real rows.
      - name: Isolation suites
        if: ${{ secrets.TEST_SUPABASE_URL != '' }}
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET || 'ci-test-secret' }}
          DISCORD_CLIENT_ID: ci
          DISCORD_CLIENT_SECRET: ci
          DISCORD_REDIRECT_URI: http://localhost/callback
        run: npm test
